name: Автопостинг новостей (RSS → Telegram)

on:
  schedule:
    # Запуск каждые 30 минут
    - cron: "*/30 * * * *"
  # Позволяет запустить вручную кнопкой в Actions (для тестов)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Настраиваем Python (версия 3.11)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Ставим зависимости из requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Запускаем бота
      - name: Run bot script
        run: python app.py
        env:
          # Эти значения берутся из GitHub Secrets (Settings → Secrets and variables → Actions)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
